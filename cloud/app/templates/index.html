<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SRF Cloud Pilot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 16px;
      background: #f4f6f8;
      color: #1f2937;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    input,
    select,
    button {
      padding: 8px;
    }

    #term {
      background: #111827;
      color: #e5e7eb;
      padding: 12px;
      height: 420px;
      overflow: auto;
      white-space: pre-wrap;
      border-radius: 6px;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
    }

    .muted {
      color: #6b7280;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="card">
    <p class="muted" style="margin-bottom:12px">
      <a href="/ui" style="color:#1d4ed8;font-weight:600">Abrir interface (upload + relatórios reais por sessão)</a>
      — após login e “Iniciar sessão”, use o link com token abaixo.
    </p>
    <p class="muted" id="uiSessionLinkWrap" style="margin-bottom:12px;display:none">
      <a id="uiSessionLink" href="/ui" style="color:#059669;font-weight:600">Abrir /ui com esta sessão (dados reais)</a>
    </p>
    <h2>SRF Cloud Pilot</h2>
    <div class="row">
      <input id="username" placeholder="usuário" />
      <input id="password" type="password" placeholder="senha" />
      <button onclick="login()">Entrar</button>
      <span id="loginStatus" class="muted"></span>
    </div>
    <div class="row">
      <select id="mode">
        <option value="standard">Modo padrão</option>
        <option value="legacy">Modo legado (--legacy)</option>
      </select>
      <button onclick="startSession()">Iniciar sessão CLI</button>
      <span id="sessionStatus" class="muted"></span>
    </div>
    <div class="row">
      <input id="uploadFile" type="file" />
      <button onclick="uploadFile()">Upload planilha</button>
      <button onclick="refreshFiles()">Listar arquivos</button>
    </div>
    <div class="row">
      <input id="downloadPath" placeholder="ex: dossiês/Dossier_FORMOSA.xlsx" style="min-width:360px" />
      <button onclick="downloadFile()">Download arquivo</button>
    </div>
  </div>

  <div class="card">
    <div id="term"></div>
    <div class="row">
      <input id="cmd" style="min-width:540px" placeholder="digite e pressione Enter" />
      <button onclick="sendLine()">Enviar</button>
    </div>
    <p class="muted">Dica: o CLI é interativo. Normalmente basta responder os prompts e pressionar Enter.</p>
  </div>

  <script>
    let token = "";
    let sessionId = "";
    let ws = null;

    function appendTerm(text) {
      const el = document.getElementById("term");
      el.textContent += text;
      el.scrollTop = el.scrollHeight;
    }

    async function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const r = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      if (!r.ok) {
        document.getElementById("loginStatus").textContent = "Falha no login";
        return;
      }
      const d = await r.json();
      token = d.token;
      document.getElementById("loginStatus").textContent = `Logado: ${d.username}`;
    }

    async function startSession() {
      if (!token) return alert("Faça login primeiro.");
      const fd = new FormData();
      fd.append("token", token);
      fd.append("mode", document.getElementById("mode").value);
      const r = await fetch("/api/sessions", { method: "POST", body: fd });
      if (!r.ok) return alert("Erro ao criar sessão.");
      const d = await r.json();
      sessionId = d.session_id;
      document.getElementById("sessionStatus").textContent = `Sessão: ${sessionId}`;
      const wrap = document.getElementById("uiSessionLinkWrap");
      const uil = document.getElementById("uiSessionLink");
      if (uil && wrap) {
        uil.href = `/ui?token=${encodeURIComponent(token)}&session_id=${encodeURIComponent(sessionId)}`;
        wrap.style.display = "block";
      }
      connectWs();
    }

    function connectWs() {
      if (ws) ws.close();
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws/${sessionId}?token=${encodeURIComponent(token)}`);
      ws.onmessage = (e) => appendTerm(e.data);
      ws.onclose = () => appendTerm("\n[websocket encerrado]\n");
    }

    function sendLine() {
      if (!ws) return;
      const c = document.getElementById("cmd");
      ws.send(c.value + "\n");
      c.value = "";
    }

    async function uploadFile() {
      if (!token || !sessionId) return alert("Inicie sessão antes.");
      const f = document.getElementById("uploadFile").files[0];
      if (!f) return alert("Selecione um arquivo.");
      const fd = new FormData();
      fd.append("token", token);
      fd.append("file", f);
      const r = await fetch(`/api/sessions/${sessionId}/upload`, { method: "POST", body: fd });
      if (!r.ok) return alert("Falha no upload");
      const d = await r.json();
      alert("Upload OK: " + d.filename);
    }

    async function refreshFiles() {
      if (!token || !sessionId) return;
      const r = await fetch(`/api/sessions/${sessionId}/files?token=${encodeURIComponent(token)}`);
      if (!r.ok) return alert("Falha ao listar arquivos");
      const d = await r.json();
      appendTerm("\n[arquivos]\n" + d.files.join("\n") + "\n");
    }

    function downloadFile() {
      if (!token || !sessionId) return;
      const p = document.getElementById("downloadPath").value.trim();
      if (!p) return;
      location.href = `/api/sessions/${sessionId}/download?token=${encodeURIComponent(token)}&path=${encodeURIComponent(p)}`;
    }
  </script>
</body>

</html>
