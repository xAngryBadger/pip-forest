[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orca"
version = "7.0.0"
description = "SRF v7 - Sistema de Restauracao Florestal scheduler engine"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "Badger", email = "badger@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pandas>=2.0,<3.0",
    "openpyxl>=3.1,<4.0",
    "rich>=13.0,<14.0",
    "colorama>=0.4,<1.0",
    "fastapi>=0.109,<1.0",
    "uvicorn>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "python-multipart>=0.0.6,<1.0",
    "jinja2>=3.1,<4.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0,<25.0",
    "isort>=5.13,<6.0",
    "mypy>=1.8,<2.0",
    "ruff>=0.3,<1.0",
    "pre-commit>=3.6,<4.0",
]
test = [
    "pytest>=7.4,<8.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.26,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["atm*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ["py312", "py313", "py314"]
include = "\\.pyi?$"
extend-exclude = """
/(
  | \\.eggs
  | \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | _build
  | buck-out
  | build
  | dist
)/
"""

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "src.atm.orca.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "T201",  # print statements allowed in CLI
    "T203",  # print statements allowed in CLI
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "data",
    "*.xlsx",
    "archive",
]
per-file-ignores = {
    "tests/*": ["T201", "T203"],
    "src/atm/orca/constants.py": ["E501"],
}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.pre-commit-hooks]
# This section is for reference; actual hooks are in .pre-commit-config.yaml
# See .pre-commit-config.yaml for the complete configuration