name: Testes E2E

on:
  push:
    branches: [ refactor/v8, main, master ]
  pull_request:
    branches: [ refactor/v8, main, master ]

jobs:
  testes:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout do código
      uses: actions/checkout@v3
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pandas openpyxl pytest
    
    - name: Teste crítico - Cascata GLOBAL
      run: |
        echo "Executando teste de cascata (crítico)..."
        python3 -m unittest tests.test_cascata_global -v
    
    - name: Testes E2E permanentes
      run: |
        echo "Executando todos os testes E2E..."
        python3 tests/run_all_e2e.py
    
    - name: Upload de resultados (se falhar)
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: resultados-testes-falha
        path: |
          data/dossiês/*.xlsx
          tests/*.log
        retention-days: 7
    
    - name: Upload de resultados (sempre)
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: resultados-testes
        path: |
          tests/*.log
        retention-days: 30
