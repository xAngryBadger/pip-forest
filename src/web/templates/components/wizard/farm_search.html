<div class="relative" id="farm-search-container">
    <input type="text" 
           id="farm-search-input" 
           class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 text-base focus:ring-2 focus:ring-blue-500 focus:border-transparent"
           placeholder="Digite para buscar fazenda..."
           autocomplete="off"
           hx-get="/api/schedule/wizard/farms?q="
           hx-trigger="keyup changed delay:300ms"
           hx-target="#farm-suggestions"
           hx-swap="innerHTML">
    <div id="farm-suggestions" class="absolute z-10 w-full mt-1 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg shadow-lg max-h-60 overflow-y-auto hidden">
        <div class="p-4 text-gray-500 dark:text-gray-400 text-center">Carregando fazendas...</div>
    </div>
    <input type="hidden" id="farm-id" value="">
    <div id="farm-selected" class="mt-2 hidden">
        <span class="inline-flex items-center px-3 py-1.5 bg-blue-100 dark:bg-blue-900/30 text-blue-800 dark:text-blue-300 rounded-lg text-sm">
            <span id="farm-name-display"></span>
            <button type="button" id="clear-farm" class="ml-2 text-blue-600 dark:text-blue-400 hover:text-blue-800">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </span>
    </div>
</div>
