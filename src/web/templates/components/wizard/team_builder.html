<div class="border border-gray-200 dark:border-gray-600 rounded-lg overflow-hidden">
    <div class="px-4 py-3 bg-gray-50 dark:bg-gray-700/50 border-b border-gray-200 dark:border-gray-600 flex items-center justify-between">
        <h4 class="font-medium text-gray-900 dark:text-gray-100">Turmas</h4>
        <button type="button" id="add-team-btn" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition flex items-center space-x-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            <span>Adicionar</span>
        </button>
    </div>
    <div id="teams-container" class="divide-y divide-gray-200 dark:divide-gray-600">
        {% if turmas %}
        {% for turma in turmas %}
        <div class="team-row p-4 grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nome</label>
                <input type="text" name="turma_nome" value="{{ turma.nome if turma.nome else 'Turma ' + (loop.index + 1) }}" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 text-base focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Operários</label>
                <input type="number" name="turma_operarios" value="{{ turma.operarios if turma.operarios else 5 }}" min="1" max="100" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 text-base focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
            </div>
            <div class="flex items-end">
                <button type="button" class="remove-team-btn px-3 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded-lg text-sm font-medium transition">
                    Remover
                </button>
            </div>
        </div>
        {% endfor %}
        {% else %}
        <div class="team-row p-4 grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nome</label>
                <input type="text" name="turma_nome" value="Turma 1" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 text-base focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Operários</label>
                <input type="number" name="turma_operarios" value="9" min="1" max="100" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 text-base focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
            </div>
            <div class="flex items-end">
                <button type="button" class="remove-team-btn px-3 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded-lg text-sm font-medium transition">
                    Remover
                </button>
            </div>
        </div>
        {% endif %}
    </div>
</div>
