<div class="turma-accordion mb-4 border border-gray-200 dark:border-gray-600 rounded-lg overflow-hidden" data-turma-index="0">
    <button type="button" class="accordion-header w-full px-4 py-3 bg-gray-50 dark:bg-gray-700/50 flex items-center justify-between text-left" aria-expanded="false">
        <span class="font-medium text-gray-900 dark:text-gray-100">
            <span class="turma-name">Turma</span>
            <span class="text-sm text-gray-500 dark:text-gray-400 ml-2">(<span class="turma-workers">0</span> operários)</span>
        </span>
        <svg class="w-5 h-5 text-gray-500 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
    </button>
    <div class="accordion-content hidden p-4 space-y-3">
        <div class="activities-grid grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2" id="activities-0">
            {% if activities %}
            {% for atv in activities %}
            <label class="flex items-center space-x-2 cursor-pointer p-2 border border-gray-200 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700/50 transition">
                <input type="checkbox" name="atividade_vinculos_0" value="{{ atv }}" class="w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                <span class="text-sm text-gray-900 dark:text-gray-100">{{ atv }}</span>
            </label>
            {% endfor %}
            {% endif %}
        </div>
        <div class="flex items-center space-x-2">
            <button type="button" class="select-all-btn px-3 py-1.5 bg-blue-100 hover:bg-blue-200 text-blue-700 rounded-lg text-sm font-medium transition">
                Selecionar todas
            </button>
            <button type="button" class="deselect-all-btn px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium transition">
                Limpar
            </button>
        </div>
    </div>
</div>
