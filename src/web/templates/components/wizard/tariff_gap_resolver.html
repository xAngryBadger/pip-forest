<div class="space-y-4" id="tariff-gaps-list">
    {% if gaps %}
    {% for gap in gaps %}
    <div class="p-4 border border-gray-200 dark:border-gray-600 rounded-lg bg-red-50 dark:bg-red-900/10" data-gap-key="{{ gap.key }}">
        <div class="flex items-start justify-between mb-3">
            <div>
                <h4 class="font-medium text-gray-900 dark:text-gray-100">{{ gap.atividade }}</h4>
                <p class="text-sm text-gray-500 dark:text-gray-400">Chave CT: <code>{{ gap.key }}</code></p>
            </div>
            <select name="resolution_type" class="px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 text-sm focus:ring-2 focus:ring-blue-500">
        <option value="manual">Entrada manual</option>
        <option value="tariff">Selecionar tarifa existente</option>
        <option value="">Ignorar (usa 8.0)</option>
      </select>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">HH/ha</label>
        <input type="number" name="manual_hh" step="0.1" value="8.0" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 text-base focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Preço R$/ha</label>
        <input type="number" name="manual_preco" step="0.01" value="0.0" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 text-base focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Custo R$/h</label>
        <input type="number" name="manual_custo" step="0.01" value="0.0" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 text-base focus:ring-2 focus:ring-blue-500">
      </div>
    </div>
    <div class="mt-3">
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Buscar tarifa existente</label>
      <input type="text" name="tariff_search" placeholder="Ex: adubo, plantio..." class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 text-base focus:ring-2 focus:ring-blue-500" hx-get="/api/schedule/wizard/tarifas/search?q=" hx-trigger="keyup changed delay:300ms" hx-target="#tariff-results-{{ loop.index }}" hx-swap="innerHTML">
      <div id="tariff-results-{{ loop.index }}" class="mt-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg max-h-40 overflow-y-auto"></div>
    </div>
  </div>
  {% endfor %}
  {% else %}
  <p class="text-gray-500 dark:text-gray-400 text-center py-8">Clique em "Verificar Lacunas" para detectar atividades sem tarifa.</p>
  {% endif %}
</div>
