{% extends "base.html" %}
{% block title %}SRF — Início{% endblock %}
{% block content %}
<div class="card p-6 mb-6">
<h1 class="text-xl font-bold mb-2" style="color: var(--primary);">SRF v6.3</h1>
<p style="color: var(--muted);" class="text-sm mb-4">Sistema de Restauração Florestal — Web</p>

<div class="grid grid-cols-1 gap-3">
<form action="{{ base_path }}/term/start" method="post">
<button type="submit" class="btn btn-primary w-full min-h-[48px]">Abrir Terminal SRF</button>
</form>
</div>
</div>

<div class="card p-4 mb-4">
<h2 class="text-sm font-bold mb-2" style="color: var(--muted);">Upload Microplanejamento</h2>
<form enctype="multipart/form-data"
hx-post="{{ base_path }}/upload" hx-target="#upload-status" hx-swap="innerHTML">
<label for="file-upload" class="block text-sm mb-1">Arquivo (.xlsx, .xlsm, .xls)</label>
<input type="file" id="file-upload" name="file" accept=".xlsx,.xlsm,.xls" class="w-full mb-2" aria-label="Selecionar arquivo de microplanejamento">
<button type="submit" class="btn btn-muted w-full min-h-[48px]">Enviar</button>
</form>
<div id="upload-status"></div>
</div>

<div class="card p-4 mb-4">
<h2 class="text-sm font-bold mb-2" style="color: var(--muted);">Upload CT (Tabela de Precos)</h2>
<form enctype="multipart/form-data"
hx-post="{{ base_path }}/upload-ct" hx-target="#ct-upload-status" hx-swap="innerHTML">
<label for="ct-file-upload" class="block text-sm mb-1">CT .xlsx (ex: ct317real.xlsx)</label>
<input type="file" id="ct-file-upload" name="file" accept=".xlsx,.xlsm,.xls" class="w-full mb-2" aria-label="Selecionar arquivo CT">
<button type="submit" class="btn btn-muted w-full min-h-[48px]">Enviar CT</button>
</form>
<div id="ct-upload-status"></div>
</div>

<div class="card p-4 mb-4">
<h2 class="text-sm font-bold mb-2" style="color: var(--muted);">Sessões Terminal</h2>
<ul class="text-sm" role="list" id="term-sessions"></ul>
<p class="text-sm" style="color: var(--muted);" id="no-sessions">Nenhuma sessão ativa</p>
</div>

<a href="{{ base_path }}/logout" class="btn btn-muted text-sm min-h-[48px]" style="color: var(--error);">Sair</a>

<script>
(function(){
var bp = '{{ base_path }}';
function loadSessions(){
fetch(bp + '/term/api/sessions', {credentials:'include'}).then(function(r){return r.json();}).then(function(sessions){
var ul=document.getElementById('term-sessions');
var no=document.getElementById('no-sessions');
if(!sessions||!sessions.length){ul.innerHTML='';no.style.display='';return;}
no.style.display='none';
ul.innerHTML=sessions.map(function(s){
var status=s.finished?'Concluída':'Em andamento';
return '<li class="mb-1"><a href="'+bp+'/term/'+s.session_id+'" style="color:var(--info);">'+s.session_id+'</a> — '+s.created_at.slice(0,19)+' — '+status+'</li>';
}).join('');
}).catch(function(){});
}
loadSessions();
setInterval(loadSessions,10000);
})();
</script>
{% endblock %}
